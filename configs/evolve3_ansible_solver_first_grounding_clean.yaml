# Clean solver-first run after proposer grounding/feedback integration fixes.
# Every mutable path is isolated from the historical 223327 workspace.
run:
  seed: 8404
  run_name: "ansible_evolve3_solver_first_grounding_clean_v1"
  max_nodes: 3
  max_expansions: 40
  bootstrap_only: false

models:
  agent_model: "Qwen/Qwen3.6-35B-A3B"
  diagnose_model: "Qwen/Qwen3.6-35B-A3B"
  temperature: 0.0
  max_tokens: 8192

agent:
  max_steps: 100
  max_tool_errors: 5
  trajectory_format: "jsonl"
  self_evolve_timeout_sec: 1800
  self_evolve_max_attempts: 3

tasks:
  batch_size: 10
  max_generation_candidates: 50
  candidates_per_signature: 5
  allow_same_repo_transfer: true
  allow_cross_repo_transfer: false

scoring:
  regression_threshold: 0.8
  regression_weight: 0.5
  proposer_target_accuracy: 0.5
  min_parent_solved_tasks: 3
  mode: hgm
  selection:
    strategy: thompson_sampling
    num_pseudo_descendant_evals: 10

diagnosis:
  mode: hgm_dual
  md_log_clip_chars: 60000
  eval_log_clip_chars: 30000
  predicted_patch_clip_chars: 20000
  code_dump_clip_chars: 80000
  max_code_files: 12

evaluation:
  solver_rollouts: 1
  deterministic: true
  level1_timeout_sec: 1200
  level2_timeout_sec: 1200
  max_workers: 4
  record_causal_diagnostics: true
  causal_ablation_hard_gate: false

proposer:
  initial_workflow: repo_chain
  candidate_timeout_sec: 180
  batch_timeout_sec: 1800
  max_concurrent_attempts: 4
  repo_chain:
    min_files: 2
    max_files: 6
    min_mutation_sites: 3
    max_mutation_sites: 8
    context_file_budget: 10
    require_generated_contracts: false
    require_causal_ablation: true
    local_causal_ablation_mode: diagnostic
    bootstrap_plans_per_call: 1
    plans_per_call: 1
    mutation_operator: "trajectory_conditioned_chain_mutation"

execution:
  backend: "subprocess"
  scratch_root: "./scratch_ansible_evolve3_solver_first_grounding_clean"
  clean_env: true
  network_disabled: true

paths:
  agent_repo: "./agent_repo_ansible_evolve3_solver_first_grounding_clean"
  repo_pool: "./repo_pool"
  runs: "./runs_ansible_evolve3_solver_first_grounding_clean"
  task_store: "./task_store_ansible_evolve3_solver_first_grounding_clean"
